<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    />
    <link rel="preload" as="image" href="/images/antalya-kapak.webp" fetchpriority="high" />
    <meta name="description" content="ANTALYA JOURNEY — Private yacht escapes, signature experiences, and curated journeys in Antalya, Turkey. Premium travel experiences in English and Russian." />
    <meta name="keywords" content="Antalya experiences, private yacht, Turkey journeys, Pamukkale, Cappadocia, travel" />
    <title>ANTALYA JOURNEY</title>
    <script>
      /* Applies the stored theme before first paint so a returning dark-mode
         visitor never sees a flash of the light theme. Kept in sync with
         THEME_STORAGE_KEY in src/context/ThemeContext.jsx. */
      (function () {
        try {
          if (localStorage.getItem('mars-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ── ANTALYA JOURNEY boot splash ─────────────────────────
         Inline so it paints as soon as the HTML arrives — before
         the JS bundle or any stylesheet loads. Dismissed from
         main.jsx once the app has mounted.

         Sequence: gold line draws → wordmark resolves out of a
         soft blur with expanding letter-spacing → eyebrow drifts
         in → line keeps a quiet breathing pulse. Exit: a curtain
         lift revealing the page underneath. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #10284E 0%, #0B1F3F 55%, #081733 100%);
        transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      #splash.splash--hide {
        transform: translateY(-100%);
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transition: opacity 0.35s ease;
      }
      #splash.splash--hide .splash-inner {
        opacity: 0;
      }
      .splash-mark {
        order: 0;
        width: 54px;
        height: 54px;
        color: #00B4D8;
        animation: splash-mark-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash-line {
        order: 1;
        width: 64px;
        height: 2px;
        background: #ffffff;
        transform-origin: center;
        animation:
          splash-line-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both,
          splash-line-breathe 1.8s ease-in-out 1.5s infinite;
      }
      @keyframes splash-mark-in {
        from { opacity: 0; transform: translateY(14px) scale(0.86); }
        to   { opacity: 1; transform: none; }
      }
      .splash-title {
        order: 2;
        margin: 0;
        font: 700 clamp(24px, 5.2vw, 40px)/1.1 'Playfair Display', Georgia, serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
        animation: splash-title-in 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
      }
      .splash-eyebrow {
        order: 3;
        margin: 0;
        font: 600 11px/1 Inter, 'Noto Sans', sans-serif;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #D4AF37;
        animation: splash-fade-up 0.8s ease 0.95s both;
      }
      @keyframes splash-line-in {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @keyframes splash-line-breathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.45; }
      }
      @keyframes splash-title-in {
        from { opacity: 0; letter-spacing: 0.02em; filter: blur(8px); transform: translateY(10px); }
        to   { opacity: 1; letter-spacing: 0.08em; filter: blur(0); transform: none; }
      }
      @keyframes splash-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: opacity 0.25s ease; }
        #splash.splash--hide { transform: none; opacity: 0; }
        .splash-mark,
        .splash-line,
        .splash-title,
        .splash-eyebrow { animation: none; }
        .splash-line { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="ANTALYA JOURNEY">
      <div class="splash-inner">
        <svg class="splash-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M21.5 38 V7 L7.5 38 Z" fill="currentColor"/>
          <path d="M25.5 38 V16 L38.5 38 Z" fill="currentColor" opacity=".55"/>
          <path d="M3 42.5 q6 3 11 0 t11 0 t11 0" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" fill="none" opacity=".8"/>
        </svg>
        <span class="splash-line" aria-hidden="true"></span>
        <p class="splash-title">Antalya Journey</p>
        <p class="splash-eyebrow">ANTALYA &middot; T&Uuml;RK&#304;YE</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
